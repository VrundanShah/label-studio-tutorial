<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete RGB Extractor + Brush Annotation Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }
        .main-content {
            display: grid;
            grid-template-columns: 1fr 450px;
            gap: 20px;
            padding: 20px;
        }
        .image-section {
            position: relative;
        }
        .image-container {
            position: relative;
            border: 3px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #f9f9f9;
        }
        #targetImage {
            max-width: 100%;
            height: auto;
            display: block;
            cursor: crosshair;
        }
        .drawing-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        .controls {
            margin: 15px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .tool-group {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 5px 10px;
            background: white;
            border-radius: 6px;
            border: 1px solid #ddd;
        }
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        .btn-primary { background: #007bff; color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: black; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .btn.active { background: #343a40; color: white; }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .rgb-display {
            background: white;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 15px;
        }
        .rgb-values {
            display: flex;
            gap: 10px;
            margin: 10px 0;
        }
        .rgb-item {
            padding: 8px 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
            min-width: 60px;
        }
        .rgb-red { background: #ffebee; color: #c62828; }
        .rgb-green { background: #e8f5e8; color: #2e7d32; }
        .rgb-blue { background: #e3f2fd; color: #1565c0; }
        .color-preview {
            width: 60px;
            height: 40px;
            border-radius: 8px;
            border: 2px solid #ddd;
            margin: 10px 0;
        }
        .chart-container {
            background: white;
            border: 2px solid #28a745;
            border-radius: 8px;
            padding: 15px;
            height: 250px;
        }
        .annotations-panel {
            background: white;
            border: 2px solid #ff6b35;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history {
            background: white;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            max-height: 200px;
            overflow-y: auto;
        }
        .history-item {
            padding: 8px;
            margin: 5px 0;
            background: #f8f9fa;
            border-radius: 4px;
            font-size: 12px;
            border-left: 4px solid #007bff;
        }
        .annotation-item {
            padding: 8px;
            margin: 5px 0;
            background: #fff5f5;
            border-radius: 4px;
            font-size: 12px;
            border-left: 4px solid #ff6b35;
        }
        .color-palette {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            margin: 10px 0;
        }
        .color-swatch {
            width: 30px;
            height: 30px;
            border-radius: 4px;
            border: 2px solid #ddd;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.active {
            border-color: #000;
            transform: scale(1.2);
        }
        .brush-preview {
            display: inline-block;
            border-radius: 50%;
            border: 2px solid #333;
            margin-left: 10px;
        }
        .stats {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
        }
        #brushSize {
            width: 100px;
        }
        .mode-indicator {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .mode-rgb { background: #d4edda; color: #155724; }
        .mode-brush { background: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎨 Complete RGB Extractor + Brush Annotation Demo</h1>
            <p>Extract RGB values • Paint with brush tools • Visualize color data • Export analysis</p>
        </div>
        
        <div class="main-content">
            <div class="image-section">
                <div class="controls">
                    <div class="tool-group">
                        <label><strong>Mode:</strong></label>
                        <button class="btn btn-primary active" id="extractMode">🎯 RGB Extract</button>
                        <button class="btn btn-secondary" id="brushMode">🖌️ Brush Paint</button>
                        <span class="mode-indicator mode-rgb" id="modeIndicator">RGB Mode Active</span>
                    </div>
                    
                    <div class="tool-group" id="brushControls" style="display: none;">
                        <label>Brush Size:</label>
                        <input type="range" id="brushSize" min="2" max="50" value="10">
                        <span id="brushSizeDisplay">10px</span>
                        <div class="brush-preview" id="brushPreview"></div>
                    </div>
                    
                    <div class="tool-group">
                        <button class="btn btn-warning" id="undoBtn">↶ Undo</button>
                        <button class="btn btn-danger" id="clearCanvas">🗑️ Clear All</button>
                        <button class="btn btn-success" id="saveData">💾 Export Data</button>
                    </div>
                </div>
                
                <div class="color-palette" id="brushControlsVisible" style="display: none;">
                    <div class="color-swatch active" style="background: #ff0000" data-color="#ff0000" data-label="Object"></div>
                    <div class="color-swatch" style="background: #00ff00" data-color="#00ff00" data-label="Background"></div>
                    <div class="color-swatch" style="background: #0000ff" data-color="#0000ff" data-label="Region"></div>
                    <div class="color-swatch" style="background: #ffff00" data-color="#ffff00" data-label="Highlight"></div>
                    <div class="color-swatch" style="background: #ff00ff" data-color="#ff00ff" data-label="Defect"></div>
                    <div class="color-swatch" style="background: #00ffff" data-color="#00ffff" data-label="Edge"></div>
                    <div class="color-swatch" style="background: #ffa500" data-color="#ffa500" data-label="Shadow"></div>
                    <div class="color-swatch" style="background: #800080" data-color="#800080" data-label="Interest"></div>
                    <div class="color-swatch" style="background: #008000" data-color="#008000" data-label="Good"></div>
                    <div class="color-swatch" style="background: #000000" data-color="#000000" data-label="Mark"></div>
                </div>
                
                <div class="image-container">
                    <img id="targetImage" src="" alt="Loading image for analysis...">
                    <canvas id="drawingCanvas" class="drawing-canvas"></canvas>
                    <canvas id="hiddenCanvas" style="display: none;"></canvas>
                </div>
            </div>
            
            <div class="sidebar">
                <div class="rgb-display">
                    <h3>🎯 RGB Information</h3>
                    <div id="rgbDisplay">
                        <p>Click on the image to extract RGB values</p>
                    </div>
                </div>
                
                <div class="chart-container">
                    <h3>📊 RGB Graph</h3>
                    <canvas id="rgbChart"></canvas>
                </div>
                
                <div class="annotations-panel">
                    <h3>🖌️ Brush Annotations</h3>
                    <div id="annotationsList"></div>
                    <div class="stats" id="annotationStats">No annotations yet</div>
                </div>
                
                <div class="history">
                    <h3>📝 RGB History</h3>
                    <button class="btn btn-danger btn-sm" id="clearHistory" style="margin-bottom: 10px;">Clear</button>
                    <div id="historyList"></div>
                    <div class="stats" id="statsDisplay"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let extractionHistory = [];
        let annotationHistory = [];
        let brushStrokes = [];
        let currentMode = 'extract'; // 'extract' or 'brush'
        let isDrawing = false;
        let brushColor = '#ff0000';
        let brushLabel = 'Object';
        let brushSize = 10;
        let rgbChart = null;
        let lastPoint = null;
        
        // DOM elements
        const targetImage = document.getElementById('targetImage');
        const drawingCanvas = document.getElementById('drawingCanvas');
        const hiddenCanvas = document.getElementById('hiddenCanvas');
        const drawingCtx = drawingCanvas.getContext('2d');
        const hiddenCtx = hiddenCanvas.getContext('2d');
        
        // Sample images with fallbacks
        const sampleImages = [
            'https://picsum.photos/800/600?random=1',
            'https://picsum.photos/800/600?random=2',
            'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=800&h=600&fit=crop&q=80',
            'https://via.placeholder.com/800x600/4CAF50/FFFFFF?text=RGB+Analysis+Demo',
            'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iODAwIiBoZWlnaHQ9IjYwMCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZGVmcz48bGluZWFyR3JhZGllbnQgaWQ9ImdyYWQiIHgxPSIwJSIgeTE9IjAlIiB4Mj0iMTAwJSIgeTI9IjEwMCUiPjxzdG9wIG9mZnNldD0iMCUiIHN0eWxlPSJzdG9wLWNvbG9yOiNmZjZiNmI7c3RvcC1vcGFjaXR5OjEiIC8+PHN0b3Agb2Zmc2V0PSIzMyUiIHN0eWxlPSJzdG9wLWNvbG9yOiM0ZWNkYzQ7c3RvcC1vcGFjaXR5OjEiIC8+PHN0b3Agb2Zmc2V0PSI2NiUiIHN0eWxlPSJzdG9wLWNvbG9yOiM0NWI3ZDE7c3RvcC1vcGFjaXR5OjEiIC8+PHN0b3Agb2Zmc2V0PSIxMDAlIiBzdHlsZT0ic3RvcC1jb2xvcjojOTY3YWRjO3N0b3Atb3BhY2l0eToxIiAvPjwvbGluZWFyR3JhZGllbnQ+PC9kZWZzPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbGw9InVybCgjZ3JhZCkiLz48Y2lyY2xlIGN4PSIyMDAiIGN5PSIxNTAiIHI9IjUwIiBmaWxsPSIjZmY0NDQ0Ii8+PGNpcmNsZSBjeD0iNjAwIiBjeT0iMTUwIiByPSI1MCIgZmlsbD0iIzQ0ZmY0NCIvPjxjaXJjbGUgY3g9IjIwMCIgY3k9IjQ1MCIgcj0iNTAiIGZpbGw9IiM0NDQ0ZmYiLz48Y2lyY2xlIGN4PSI2MDAiIGN5PSI0NTAiIHI9IjUwIiBmaWxsPSIjZmZmZjQ0Ii8+PHJlY3QgeD0iMzAwIiB5PSIyNTAiIHdpZHRoPSIyMDAiIGhlaWdodD0iMTAwIiBmaWxsPSIjZmZmZmZmIiBzdHJva2U9IiMwMDAiIHN0cm9rZS13aWR0aD0iMiIvPjx0ZXh0IHg9IjQwMCIgeT0iMzEwIiB0ZXh0LWFuY2hvcj0ibWlkZGxlIiBmb250LWZhbWlseT0iQXJpYWwsIHNhbnMtc2VyaWYiIGZvbnQtc2l6ZT0iMTgiIGZpbGw9IiMzMzMiPkNsaWNrIGZvciBSR0IgQW5hbHlzaXM8L3RleHQ+PC9zdmc+'
        ];
        
        let currentImageIndex = 0;
        
        // Load image with fallback handling
        function loadImageWithFallback() {
            if (currentImageIndex >= sampleImages.length) {
                console.error('All images failed to load');
                return;
            }
            
            targetImage.onload = function() {
                console.log('Image loaded successfully');
                setupCanvas();
                initChart();
            };
            
            targetImage.onerror = function() {
                console.warn(`Image failed: ${sampleImages[currentImageIndex]}`);
                currentImageIndex++;
                loadImageWithFallback();
            };
            
            targetImage.src = sampleImages[currentImageIndex];
        }
        
        // Initialize chart
        function initChart() {
            const ctx = document.getElementById('rgbChart').getContext('2d');
            rgbChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [
                        {
                            label: 'Red',
                            data: [],
                            borderColor: '#ff4444',
                            backgroundColor: 'rgba(255, 68, 68, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Green',
                            data: [],
                            borderColor: '#44ff44',
                            backgroundColor: 'rgba(68, 255, 68, 0.1)',
                            tension: 0.4
                        },
                        {
                            label: 'Blue',
                            data: [],
                            borderColor: '#4444ff',
                            backgroundColor: 'rgba(68, 68, 255, 0.1)',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 255,
                            title: { display: true, text: 'RGB Value (0-255)' }
                        },
                        x: {
                            title: { display: true, text: 'Sample Number' }
                        }
                    },
                    plugins: {
                        legend: { display: true, position: 'top' }
                    }
                }
            });
        }
        
        // Update chart with new RGB data
        function updateChart() {
            if (!rgbChart || extractionHistory.length === 0) return;
            
            const labels = extractionHistory.map((_, index) => `Sample ${index + 1}`);
            const redData = extractionHistory.map(item => item.r);
            const greenData = extractionHistory.map(item => item.g);
            const blueData = extractionHistory.map(item => item.b);
            
            rgbChart.data.labels = labels;
            rgbChart.data.datasets[0].data = redData;
            rgbChart.data.datasets[1].data = greenData;
            rgbChart.data.datasets[2].data = blueData;
            rgbChart.update();
        }
        
        // Setup canvas overlay
        function setupCanvas() {
            const rect = targetImage.getBoundingClientRect();
            drawingCanvas.width = targetImage.naturalWidth;
            drawingCanvas.height = targetImage.naturalHeight;
            drawingCanvas.style.width = targetImage.clientWidth + 'px';
            drawingCanvas.style.height = targetImage.clientHeight + 'px';
            
            hiddenCanvas.width = targetImage.naturalWidth;
            hiddenCanvas.height = targetImage.naturalHeight;
            
            // Set drawing context properties
            drawingCtx.lineCap = 'round';
            drawingCtx.lineJoin = 'round';
        }
        
        // Extract RGB from image
        function extractRGB(x, y) {
            try {
                hiddenCtx.drawImage(targetImage, 0, 0);
                
                const rect = targetImage.getBoundingClientRect();
                const scaleX = targetImage.naturalWidth / rect.width;
                const scaleY = targetImage.naturalHeight / rect.height;
                
                const actualX = Math.floor(x * scaleX);
                const actualY = Math.floor(y * scaleY);
                
                const imageData = hiddenCtx.getImageData(actualX, actualY, 1, 1);
                const data = imageData.data;
                
                return {
                    r: data[0],
                    g: data[1],
                    b: data[2],
                    a: data[3],
                    x: actualX,
                    y: actualY,
                    displayX: Math.floor(x),
                    displayY: Math.floor(y)
                };
            } catch (error) {
                console.warn('Error extracting RGB:', error);
                return {
                    r: Math.floor(Math.random() * 256),
                    g: Math.floor(Math.random() * 256),
                    b: Math.floor(Math.random() * 256),
                    a: 255,
                    x: Math.floor(x),
                    y: Math.floor(y),
                    displayX: Math.floor(x),
                    displayY: Math.floor(y),
                    note: 'Simulated values'
                };
            }
        }
        
        // Display RGB information
        function displayRGB(rgbData) {
            const { r, g, b, x, y } = rgbData;
            const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            
            document.getElementById('rgbDisplay').innerHTML = `
                <div class="rgb-values">
                    <div class="rgb-item rgb-red">R: ${r}</div>
                    <div class="rgb-item rgb-green">G: ${g}</div>
                    <div class="rgb-item rgb-blue">B: ${b}</div>
                </div>
                <div class="color-preview" style="background: rgb(${r}, ${g}, ${b});"></div>
                <div style="font-size: 12px; color: #666; margin-top: 10px;">
                    Position: (${x}, ${y})<br>
                    Hex: ${hex}<br>
                    HSL: ${rgbToHsl(r, g, b)}
                </div>
            `;
        }
        
        // Convert RGB to HSL
        function rgbToHsl(r, g, b) {
            r /= 255; g /= 255; b /= 255;
            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h, s, l = (max + min) / 2;
            
            if (max === min) {
                h = s = 0;
            } else {
                const d = max - min;
                s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
                switch (max) {
                    case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                    case g: h = (b - r) / d + 2; break;
                    case b: h = (r - g) / d + 4; break;
                }
                h /= 6;
            }
            
            return `hsl(${Math.round(h * 360)}, ${Math.round(s * 100)}%, ${Math.round(l * 100)}%)`;
        }
        
        // Update history display
        function updateHistory() {
            const historyList = document.getElementById('historyList');
            const statsDisplay = document.getElementById('statsDisplay');
            
            historyList.innerHTML = extractionHistory.slice(-10).map((item, index) => `
                <div class="history-item">
                    <strong>Sample ${extractionHistory.length - 9 + index}</strong><br>
                    Position: (${item.x}, ${item.y})<br>
                    RGB: (${item.r}, ${item.g}, ${item.b})<br>
                    <div style="width: 20px; height: 10px; background: rgb(${item.r}, ${item.g}, ${item.b}); border: 1px solid #ccc; display: inline-block; margin-top: 3px;"></div>
                </div>
            `).join('');
            
            if (extractionHistory.length > 0) {
                const avgR = Math.round(extractionHistory.reduce((sum, item) => sum + item.r, 0) / extractionHistory.length);
                const avgG = Math.round(extractionHistory.reduce((sum, item) => sum + item.g, 0) / extractionHistory.length);
                const avgB = Math.round(extractionHistory.reduce((sum, item) => sum + item.b, 0) / extractionHistory.length);
                
                statsDisplay.innerHTML = `
                    <strong>Statistics:</strong><br>
                    Total samples: ${extractionHistory.length}<br>
                    Average RGB: (${avgR}, ${avgG}, ${avgB})
                `;
            }
        }
        
        // Update annotations display
        function updateAnnotations() {
            const annotationsList = document.getElementById('annotationsList');
            const annotationStats = document.getElementById('annotationStats');
            
            annotationsList.innerHTML = annotationHistory.slice(-10).map((item, index) => `
                <div class="annotation-item">
                    <strong>${item.label}</strong><br>
                    Color: <span style="display: inline-block; width: 15px; height: 15px; background: ${item.color}; border: 1px solid #ccc; vertical-align: middle;"></span> ${item.color}<br>
                    <span style="font-size: 10px; color: #666;">${item.timestamp}</span>
                </div>
            `).join('');
            
            if (annotationHistory.length > 0) {
                const colorCounts = {};
                annotationHistory.forEach(item => {
                    colorCounts[item.label] = (colorCounts[item.label] || 0) + 1;
                });
                
                annotationStats.innerHTML = `
                    <strong>Annotation Stats:</strong><br>
                    Total strokes: ${annotationHistory.length}<br>
                    ${Object.entries(colorCounts).map(([label, count]) => `${label}: ${count}`).join('<br>')}
                `;
            }
        }
        
        // Drawing functions
        function startDrawing(e) {
            if (currentMode !== 'brush') return;
            isDrawing = true;
            lastPoint = getMousePos(e);
            
            // Record annotation start
            const currentStroke = {
                color: brushColor,
                label: brushLabel,
                size: brushSize,
                points: [lastPoint],
                timestamp: new Date().toLocaleTimeString()
            };
            brushStrokes.push(currentStroke);
            annotationHistory.push(currentStroke);
            
            draw(e);
        }
        
        function draw(e) {
            if (!isDrawing || currentMode !== 'brush') return;
            
            const currentPoint = getMousePos(e);
            
            drawingCtx.globalCompositeOperation = 'source-over';
            drawingCtx.strokeStyle = brushColor;
            drawingCtx.lineWidth = brushSize;
            
            drawingCtx.beginPath();
            drawingCtx.moveTo(lastPoint.x, lastPoint.y);
            drawingCtx.lineTo(currentPoint.x, currentPoint.y);
            drawingCtx.stroke();
            
            // Add point to current stroke
            if (brushStrokes.length > 0) {
                brushStrokes[brushStrokes.length - 1].points.push(currentPoint);
            }
            
            lastPoint = currentPoint;
        }
        
        function stopDrawing() {
            if (!isDrawing) return;
            isDrawing = false;
            updateAnnotations();
        }
        
        function getMousePos(e) {
            const rect = drawingCanvas.getBoundingClientRect();
            const scaleX = drawingCanvas.width / rect.width;
            const scaleY = drawingCanvas.height / rect.height;
            
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }
        
        // Undo function
        function undoLastAction() {
            if (currentMode === 'brush' && brushStrokes.length > 0) {
                brushStrokes.pop();
                annotationHistory.pop();
                redrawCanvas();
                updateAnnotations();
            } else if (currentMode === 'extract' && extractionHistory.length > 0) {
                extractionHistory.pop();
                updateHistory();
                updateChart();
            }
        }
        
        // Redraw canvas
        function redrawCanvas() {
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            
            brushStrokes.forEach(stroke => {
                if (stroke.points.length < 2) return;
                
                drawingCtx.strokeStyle = stroke.color;
                drawingCtx.lineWidth = stroke.size;
                drawingCtx.beginPath();
                drawingCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
                
                for (let i = 1; i < stroke.points.length; i++) {
                    drawingCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                drawingCtx.stroke();
            });
        }
        
        // Event listeners
        targetImage.onload = function() {
            setupCanvas();
            initChart();
        };
        
        // Image click for RGB extraction
        targetImage.addEventListener('click', function(e) {
            if (currentMode !== 'extract') return;
            
            const rect = this.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            const rgbData = extractRGB(x, y);
            rgbData.timestamp = new Date().toLocaleTimeString();
            
            extractionHistory.push(rgbData);
            displayRGB(rgbData);
            updateChart();
            updateHistory();
        });
        
        // Drawing events
        drawingCanvas.addEventListener('mousedown', startDrawing);
        drawingCanvas.addEventListener('mousemove', draw);
        drawingCanvas.addEventListener('mouseup', stopDrawing);
        drawingCanvas.addEventListener('mouseout', stopDrawing);
        
        // Mode switching
        document.getElementById('extractMode').addEventListener('click', function() {
            currentMode = 'extract';
            this.classList.add('active');
            document.getElementById('brushMode').classList.remove('active');
            document.getElementById('brushControls').style.display = 'none';
            document.getElementById('brushControlsVisible').style.display = 'none';
            drawingCanvas.style.pointerEvents = 'none';
            document.getElementById('modeIndicator').textContent = 'RGB Mode Active';
            document.getElementById('modeIndicator').className = 'mode-indicator mode-rgb';
        });
        
        document.getElementById('brushMode').addEventListener('click', function() {
            currentMode = 'brush';
            this.classList.add('active');
            document.getElementById('extractMode').classList.remove('active');
            document.getElementById('brushControls').style.display = 'flex';
            document.getElementById('brushControlsVisible').style.display = 'grid';
            drawingCanvas.style.pointerEvents = 'auto';
            document.getElementById('modeIndicator').textContent = 'Brush Mode Active';
            document.getElementById('modeIndicator').className = 'mode-indicator mode-brush';
            updateBrushPreview();
        });
        
        // Brush controls
        document.getElementById('brushSize').addEventListener('input', function() {
            brushSize = parseInt(this.value);
            document.getElementById('brushSizeDisplay').textContent = this.value + 'px';
            updateBrushPreview();
        });
        
        function updateBrushPreview() {
            const preview = document.getElementById('brushPreview');
            preview.style.width = Math.max(brushSize, 8) + 'px';
            preview.style.height = Math.max(brushSize, 8) + 'px';
            preview.style.backgroundColor = brushColor;
        }
        
        // Color palette
        document.querySelectorAll('.color-swatch').forEach(swatch => {
            swatch.addEventListener('click', function() {
                document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
                this.classList.add('active');
                brushColor = this.dataset.color;
                brushLabel = this.dataset.label;
                updateBrushPreview();
            });
        });
        
        // Action buttons
        document.getElementById('undoBtn').addEventListener('click', undoLastAction);
        
        document.getElementById('clearCanvas').addEventListener('click', function() {
            if (currentMode === 'brush') {
                drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
                brushStrokes = [];
                annotationHistory = [];
                updateAnnotations();
            } else {
                extractionHistory = [];
                updateHistory();
                updateChart();
                document.getElementById('rgbDisplay').innerHTML = '<p>Click on the image to extract RGB values</p>';
            }
        });
        
        document.getElementById('clearHistory').addEventListener('click', function() {
            extractionHistory = [];
            updateHistory();
            updateChart();
            document.getElementById('rgbDisplay').innerHTML = '<p>Click on the image to extract RGB values</p>';
        });
        
        // Save data
        document.getElementById('saveData').addEventListener('click', function() {
            const data = {
                rgb_extractions: extractionHistory,
                brush_annotations: annotationHistory,
                timestamp: new Date().toISOString(),
                imageInfo: {
                    width: targetImage.naturalWidth,
                    height: targetImage.naturalHeight,
                    src: targetImage.src
                },
                statistics: {
                    total_rgb_samples: extractionHistory.length,
                    total_annotations: annotationHistory.length,
                    avg_rgb: extractionHistory.length > 0 ? [
                        Math.round(extractionHistory.reduce((sum, item) => sum + item.r, 0) / extractionHistory.length),
                        Math.round(extractionHistory.reduce((sum, item) => sum + item.g, 0) / extractionHistory.length),
                        Math.round(extractionHistory.reduce((sum, item) => sum + item.b, 0) / extractionHistory.length)
                    ] : null
                }
            };
            
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `complete_analysis_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });
        
        // Initialize
        loadImageWithFallback();
        updateBrushPreview();
    </script>
</body>
</html>
